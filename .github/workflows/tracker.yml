name: LoL Patch Tracker Scheduler

on:
  schedule:
    #Runs automatically every 2 hours using POSIX cron syntax
    - cron: '0 */2 * * *'
  #Enables manual workflow trigger directly from the GitHub Actions tab
  workflow_dispatch:

jobs:
  check-patch:
    #Use the latest Ubuntu runner virtual environment
    runs-on: ubuntu-latest

    steps:
      #Step 1: Check out the repository source code so the runner can access it
      - name: Checkout Repository
        uses: actions/checkout@v4

      #Step 2: Set up the required Python runtime environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #Step 3: Install all required external dependencies from requirements.txt
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      #Step 4: Execute the tracking script passing the secure Webhook URL from GitHub Secrets
      - name: Run Patch Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python patch_tracker.py
