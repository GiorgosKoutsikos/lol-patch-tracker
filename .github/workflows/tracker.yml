name: LoL Patch Tracker Scheduler

on:
  schedule:
    #Runs automatically every 2 hours using POSIX cron syntax
    - cron: '0 */2 * * *'
  #Enables manual workflow trigger directly from the GitHub Actions tab
  workflow_dispatch:

#Grant write permissions to commit changes back to the repository
permissions:
  contents: write

jobs:
  check-patch:
    runs-on: ubuntu-latest

    steps:
      #Step 1: Check out repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      #Step 2: Set up Python runtime
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      #Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      #Step 4: Run the patch tracking script
      - name: Run Patch Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python patch_tracker.py

      #Step 5: Automatically commit and push last_patch.txt if it changed
      - name: Commit and push updated patch state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_patch.txt
          # Commit only if last_patch.txt was created or modified
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update last_patch.txt state [skip ci]" && git push)
